name: Build ROM
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g libdragon
      - run: '[ -d .libdragon ] || libdragon init'
      - run: libdragon make
      - uses: actions/upload-artifact@v4
        with:
          name: pudim-rom
          path: "*.z64"
