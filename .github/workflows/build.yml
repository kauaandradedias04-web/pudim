name: Build ROM
on:
  push:
  workflow_dispatch:
env:
  N64_INST: /opt/libdragon
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y build-essential libpng-dev git wget
      - name: Instalar toolchain MIPS
        run: |
          wget https://github.com/n64brew/libdragon/releases/latest/download/gcc-toolchain-mips64-x86_64.deb
          sudo dpkg -i gcc-toolchain-mips64-x86_64.deb
      - name: Instalar libdragon
        run: |
          git clone --depth 1 https://github.com/n64brew/libdragon.git /tmp/libdragon
          cd /tmp/libdragon
          ./build.sh
      - name: Compilar o jogo
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: pudim-rom
          path: "**/*.z64"
